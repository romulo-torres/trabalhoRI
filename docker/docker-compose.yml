services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - type: bind
        source: ../data/es
        target: /usr/share/elasticsearch/data
    networks:
      - reference-net

  system:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: colecao-referencia
    depends_on:
      - elasticsearch
    environment:
      - ES_HOST=http://elasticsearch:9200
    volumes:
      - type: bind
        source: ../src
        target: /app/src
      - type: bind
        source: ../data/videos
        target: /app/data/videos
      - type: bind
        source: ../data/metadata
        target: /app/data/metadata
      - type: bind
        source: ../data/embeddings
        target: /app/data/embeddings
      - type: bind
        source: ../data/queries
        target: /app/data/queries
      - type: bind
        source: ../data/judgments
        target: /app/data/judgments
      - type: bind
        source: ../data/qrels
        target: /app/data/qrels
      - type: bind
        source: ../data/evaluation
        target: /app/data/evaluation
      - type: bind
        source: ../data/state
        target: /app/data/state
      - type: bind
        source: ../data/cache
        target: /app/data/cache
      - type: bind
        source: ../logs
        target: /app/logs
      - type: bind
        source: ../.env
        target: /app/.env
    networks:
      - reference-net

networks:
  reference-net:
    driver: bridge
